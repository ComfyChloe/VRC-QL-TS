[package]
name = "vrc-launcher"
version = "0.1.0"
description = "VRC Launcher - Quick launch tool for multiple VRChat instances and profiles"
authors = ["ComfyChloe"]
edition = "2021"

[lib]
name = "vrc_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }
